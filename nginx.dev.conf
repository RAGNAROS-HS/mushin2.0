# Dev only (mounted by compose.override.yaml): the same routes as nginx.conf,
# but the browser never caches anything, so a plain reload always shows the
# files as they are on disk.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    etag off;
    if_modified_since off;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.ttf$ {
        types { }
        default_type font/ttf;
    }

    location ^~ /projects/ { return 301 /#projects; }
    location = /pdfs/CV3_0.pdf { return 301 /pdfs/CV4_0.pdf; }
}
