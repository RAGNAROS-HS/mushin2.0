# Dev only (mounted by compose.override.yaml): tell the browser never to
# cache anything, so every reload gets the files as they are on disk.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header Cache-Control "no-store" always;
        etag off;
        if_modified_since off;
    }
}
