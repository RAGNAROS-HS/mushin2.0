<!DOCTYPE html>
<html lang="en" data-root="{{root}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="{{og_type}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="{{url}}">
{{head}}<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13' font-family='monospace'>%24</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{root}}styles.css?v={{v}}">
<script>
// Set the theme before first paint so there is no flash of the wrong palette.
(function () {
  var t;
  try { t = localStorage.getItem("hsk.theme"); } catch (e) {}
  if (t !== "light" && t !== "dark") {
    t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  document.documentElement.dataset.theme = t;
  var b;
  try { b = localStorage.getItem("hsk.beaver"); } catch (e) {}
  document.documentElement.dataset.beaver = b === "loud" ? "loud" : "quiet";
})();
</script>
</head>
<body{{body_class}}>
<div class="page">

<!-- Generated by bin/build.py. Edit templates/, content/ or tracks/, not this file. -->

<header class="bar">
  <span class="host">hsk@infra</span>
  <nav class="nav">
    <a href="{{home}}#whoami">[<span data-i18n="n1">whoami</span>]</a>
    <a href="{{home}}#timeline">[<span data-i18n="n2">timeline</span>]</a>
    <a href="{{home}}#projects">[<span data-i18n="n3">projects</span>]</a>
  </nav>
  <span class="grow"></span>
  <div class="langs">
    <button type="button" class="lang is-on" data-lang="en" aria-pressed="true">EN</button>
    <span class="slash">/</span>
    <button type="button" class="lang" data-lang="pl" aria-pressed="false">PL</button>
  </div>
  <button type="button" class="theme-toggle" id="theme-toggle">[dark]</button>
  <button type="button" class="theme-toggle" id="beaver-toggle" title="beaver colours">[loud]</button>
</header>

<main class="main">

{{main}}

</main>

</div>
<script src="{{root}}pixel.js?v={{v}}"></script>
<script src="{{root}}app.js?v={{v}}"></script>
{{scripts}}</body>
</html>
