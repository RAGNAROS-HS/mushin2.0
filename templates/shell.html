<!DOCTYPE html>
<html lang="en" data-root="{{root}}" data-section="{{section}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="{{og_type}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="{{url}}">
<link rel="alternate" type="application/atom+xml" title="Hugo Sokołowski-Katzer" href="{{root}}feed.xml">
<link rel="icon" href="{{icon}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{root}}styles.css?v={{v}}">
<script>
// Set the theme before first paint so there is no flash of the wrong palette.
(function () {
  var t;
  try { t = localStorage.getItem("hsk.theme"); } catch (e) {}
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
})();
</script>
</head>
<body>

<!-- Generated by bin/build.py. Edit templates/, posts/, series/ or content/, not this file. -->

<header class="bar">
  <span class="ps"><a class="host" href="{{home}}">hsk@hugokatzer</a>:<span class="cwd">{{cwd}}</span>$</span>
  <nav class="nav">
    <a class="nav-blog" href="{{root}}blog/">blog</a>
    <a class="nav-projects" href="{{root}}projects/">projects</a>
    <a class="nav-cv" href="{{root}}cv/">cv</a>
    <a class="nav-rss" href="{{root}}feed.xml" title="Atom feed">rss</a>
    <button type="button" class="btn" id="theme-toggle" aria-label="switch colour theme">[theme]</button>
  </nav>
</header>

<main class="main">
{{main}}
</main>

<footer class="foot">
  <div class="term" id="term" hidden>
    <div class="term-out" id="term-out" aria-live="polite"></div>
    <form class="term-line" id="term-form" autocomplete="off">
      <label class="ps" for="term-in"><span class="host">hsk@hugokatzer</span>:<span class="cwd" id="term-cwd">~</span>$</label>
      <input id="term-in" class="term-in" type="text" spellcheck="false" autocapitalize="off" aria-label="shell">
    </form>
  </div>
  <p class="foot-line">
    <span>&copy; {{year}} Hugo Sokołowski-Katzer</span>
    <a href="mailto:hugo.s.katzer@gmail.com">mail</a>
    <a href="https://github.com/RAGNAROS-HS">github</a>
    <a href="https://www.linkedin.com/in/hugo-sokolowski-katzer-715577248/">linkedin</a>
    <a href="{{root}}books/">books</a>
    <a href="{{root}}feed.xml">feed.xml</a>
    <span class="grow"></span>
    <button type="button" class="btn foot-hint" id="term-open" title="or press /">$ _</button>
  </p>
  <p class="foot-build dim">static html · built by bin/build.py · v{{v}}</p>
</footer>

<script src="{{root}}app.js?v={{v}}"></script>
{{scripts}}</body>
</html>
