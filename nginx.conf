# The site's own nginx, baked into the image as /etc/nginx/conf.d/default.conf.
# TLS and the www redirect live in the VPS's host nginx (deploy/host-nginx.md);
# this serves the static files behind it on 127.0.0.1:3000.

map $uri $cache_control {
    ~*\.(css|js)$   "public, max-age=31536000, immutable";   # loaded with ?v=<hash>
    ~^/fonts/       "public, max-age=31536000, immutable";
    ~^/pdfs/        "public, max-age=86400";
    default         "no-cache";                              # html, feed, version.txt
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirect with a relative Location, so /writing -> /writing/ keeps the
    # visitor's https instead of sending them to http://...:80.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml font/ttf
               application/atom+xml application/xml text/xml text/plain;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The full CSP is a <meta> tag written by bin/build.py (it hashes the
    # inline script); frame-ancestors only works as a header.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.ttf$ {
        types { }
        default_type font/ttf;
    }

    # URLs from the previous sites, so old links and bookmarks still land.
    location ^~ /projects/ { return 301 /#projects; }
    location = /pdfs/CV3_0.pdf { return 301 /pdfs/CV4_0.pdf; }
}
